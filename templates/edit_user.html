{% extends 'base.html' %}
{% block title %}Edit User{% endblock %}
{% block page_title %}Edit User{% endblock %}
{% block content %}
<div style="max-width:560px">
  <div class="card">
    <div class="card-header"><h2>👤 Edit User: {{ user['username'] }}</h2></div>
    <div class="card-body">
      <form method="POST">
        <div class="form-grid" style="grid-template-columns:1fr 1fr">
          <div class="form-group form-span-2">
            <label>Full Name *</label>
            <input type="text" name="full_name" class="form-control" value="{{ user['full_name'] }}" required>
          </div>
          <div class="form-group">
            <label>Role *</label>
            <select name="role" class="form-control" required>
              <option value="administrator" {% if user['role'] == 'administrator' %}selected{% endif %}>Administrator</option>
              <option value="biomedical_engineer" {% if user['role'] == 'biomedical_engineer' %}selected{% endif %}>Biomedical Engineer</option>
              <option value="biomedical_technician" {% if user['role'] == 'biomedical_technician' %}selected{% endif %}>Biomedical Technician</option>
              <option value="hospital_equipment_repairer" {% if user['role'] == 'hospital_equipment_repairer' %}selected{% endif %}>Hospital Equipment Repairer</option>
              <option value="technical_assistant" {% if user['role'] == 'technical_assistant' %}selected{% endif %}>Technical Assistant</option>
              <option value="handy_man" {% if user['role'] == 'handy_man' %}selected{% endif %}>Handy Man</option>
              <option value="intern" {% if user['role'] == 'intern' %}selected{% endif %}>Intern</option>
            </select>
          </div>
          <div class="form-group form-span-2">
            <label>Email</label>
            <input type="email" name="email" class="form-control" value="{{ user['email'] or '' }}">
          </div>
        </div>
        <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:16px">
          <a href="{{ url_for('user_list') }}" class="btn btn-ghost">Cancel</a>
          <button type="submit" class="btn btn-primary">Update User</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
