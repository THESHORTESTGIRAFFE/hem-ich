{% extends 'base.html' %}
{% block title %}Categories{% endblock %}
{% block page_title %}Category Management{% endblock %}
{% block content %}
<div style="display:flex;justify-content:flex-end;margin-bottom:18px">
  <a href="{{ url_for('add_category') }}" class="btn btn-primary">+ Add Category</a>
</div>
<div class="card">
  <div class="table-wrap">
    <table>
      <thead><tr><th>Category</th><th></th></tr></thead>
      <tbody>
        {% for c in categories %}
        <tr>
          <td style="font-weight:600">{{ c['name'] }}</td>
          <td style="text-align:right">
            <a href="{{ url_for('edit_category', cid=c['id']) }}" class="btn btn-ghost btn-sm">Edit</a>
            <form method="POST" action="{{ url_for('delete_category', cid=c['id']) }}" style="display:inline" onsubmit="return confirm('Delete this category?')">
                <button type="submit" class="btn btn-ghost btn-sm" style="color:var(--danger)">Delete</button>
            </form>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
